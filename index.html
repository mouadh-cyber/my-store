<script>
const SUPABASE_URL = 'https://epkhtwhlufjzrzolhxhu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_95uJKBk66j0Gnac6aUaW6A_4FHQE7Fn';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DB = {
  KEYS: { PRODUCTS: 'sinister_products', CATEGORIES: 'sinister_categories', ORDERS: 'sinister_orders', SETTINGS: 'sinister_settings', ADMIN: 'sinister_admin', SESSION: 'sinister_session', CART: 'sinister_cart' },
  cache: { products: [], categories: [], orders: [], settings: {}, admin: null },
  loaded: false,
  ready: null,

  async init() {
    try {
      const [productsRes, categoriesRes, ordersRes, settingsRes] = await Promise.all([
        supabaseClient.from('products').select('*').order('id', { ascending: true }),
        supabaseClient.from('categories').select('*').order('sort_order', { ascending: true }),
        supabaseClient.from('orders').select('*').order('created_at', { ascending: false }),
        supabaseClient.from('settings').select('*').eq('id', 1).maybeSingle()
      ]);

      if (productsRes.error) throw productsRes.error;
      if (categoriesRes.error) throw categoriesRes.error;
      if (ordersRes.error) throw ordersRes.error;
      if (settingsRes.error) throw settingsRes.error;

      this.cache.products = (productsRes.data || []).map(this.fromProduct);
      this.cache.categories = (categoriesRes.data || []).map(this.fromCategory);
      this.cache.orders = (ordersRes.data || []).map(this.fromOrder);
      this.cache.settings = settingsRes.data ? this.fromSettings(settingsRes.data) : {};
      this.loaded = true;
      console.log('Supabase connected successfully');
    } catch (error) {
      console.error('Supabase initialization error:', error);
      this.loaded = true;
      showToast('Could not load database data', 'error');
    }
  },

  get(key) {
    switch (key) {
      case this.KEYS.PRODUCTS: return this.cache.products;
      case this.KEYS.CATEGORIES: return this.cache.categories;
      case this.KEYS.ORDERS: return this.cache.orders;
      case this.KEYS.SETTINGS: return this.cache.settings;
      case this.KEYS.ADMIN: {
        try { return JSON.parse(localStorage.getItem(this.KEYS.ADMIN) || 'null'); } catch { return null; }
      }
      default: {
        try { const val = localStorage.getItem(key); return val ? JSON.parse(val) : null; } catch { return null; }
      }
    }
  },

  async set(key, data) {
    try {
      if (key === this.KEYS.PRODUCTS) {
        this.cache.products = data;
        const rows = data.map(this.toProduct);
        if (rows.length) {
          const { error } = await supabaseClient.from('products').upsert(rows, { onConflict: 'id' });
          if (error) throw error;
          const ids = rows.map(r => r.id);
          const { data: current } = await supabaseClient.from('products').select('id');
          const toDelete = (current || []).filter(r => !ids.includes(r.id)).map(r => r.id);
          if (toDelete.length) {
            const { error: deleteError } = await supabaseClient.from('products').delete().in('id', toDelete);
            if (deleteError) throw deleteError;
          }
        } else {
          const { error } = await supabaseClient.from('products').delete().neq('id', 0);
          if (error) throw error;
        }
      } else if (key === this.KEYS.CATEGORIES) {
        this.cache.categories = data;
        const rows = data.map(this.toCategory);
        if (rows.length) {
          const { error } = await supabaseClient.from('categories').upsert(rows, { onConflict: 'id' });
          if (error) throw error;
          const ids = rows.map(r => r.id);
          const { data: current } = await supabaseClient.from('categories').select('id');
          const toDelete = (current || []).filter(r => !ids.includes(r.id)).map(r => r.id);
          if (toDelete.length) {
            const { error: deleteError } = await supabaseClient.from('categories').delete().in('id', toDelete);
            if (deleteError) throw deleteError;
          }
        }
      } else if (key === this.KEYS.ORDERS) {
        this.cache.orders = data;
        const rows = data.map(this.toOrder);
        if (rows.length) {
          const { error } = await supabaseClient.from('orders').upsert(rows, { onConflict: 'id' });
          if (error) throw error;
        }
      } else if (key === this.KEYS.SETTINGS) {
        this.cache.settings = data;
        const { error } = await supabaseClient.from('settings').upsert(this.toSettings(data), { onConflict: 'id' });
        if (error) throw error;
      } else if (key === this.KEYS.ADMIN || key === this.KEYS.SESSION || key === this.KEYS.CART) {
        localStorage.setItem(key, JSON.stringify(data));
      }
    } catch (error) {
      console.error('Database save error:', error);
      showToast('Database save failed: ' + (error.message || 'Unknown error'), 'error');
      throw error;
    }
  },

  fromProduct: r => ({
    id: Number(r.id), name: r.name, description: r.description || '', price: Number(r.price || 0),
    discountPrice: r.discount_price == null ? null : Number(r.discount_price), category: r.category || '',
    sizes: r.sizes || [], colors: r.colors || [], stock: Number(r.stock || 0), images: r.images || [],
    featured: !!r.featured, isNew: !!r.is_new, enabled: r.enabled !== false,
    createdAt: r.created_at || new Date().toISOString()
  }),
  toProduct: p => ({
    id: Number(p.id), name: p.name, description: p.description || null, price: Number(p.price || 0),
    discount_price: p.discountPrice == null ? null : Number(p.discountPrice), category: p.category || null,
    sizes: p.sizes || [], colors: p.colors || [], stock: Number(p.stock || 0), images: p.images || [],
    featured: !!p.featured, is_new: !!p.isNew, enabled: p.enabled !== false,
    created_at: p.createdAt || new Date().toISOString()
  }),
  fromCategory: r => ({ id: Number(r.id), name: r.name, slug: r.slug || '', description: r.description || '', image: '', order: Number(r.sort_order || 1) }),
  toCategory: c => ({ id: Number(c.id), name: c.name, slug: c.slug || '', description: c.description || null, sort_order: Number(c.order || 1) }),
  fromOrder: r => ({
    id: r.id, customerName: r.customer_name || '', customerPhone: r.customer_phone || '', customerEmail: r.customer_email || '',
    shippingAddress: r.shipping_address || '', notes: r.notes || '', items: r.items || [], subtotal: Number(r.subtotal || 0),
    status: r.status || 'new', createdAt: r.created_at || new Date().toISOString()
  }),
  toOrder: o => ({
    id: o.id, customer_name: o.customerName || '', customer_phone: o.customerPhone || '', customer_email: o.customerEmail || null,
    shipping_address: o.shippingAddress || '', notes: o.notes || null, items: o.items || [], subtotal: Number(o.subtotal || 0),
    status: o.status || 'new', created_at: o.createdAt || new Date().toISOString()
  }),
  fromSettings: r => ({
    storeName: r.store_name || '', storeDescription: r.store_description || '', whatsapp: r.whatsapp || '', email: r.email || '',
    instagram: r.instagram || '', instagramLink: r.instagram_link || '', tiktok: r.tiktok || '', tiktokLink: r.tiktok_link || '',
    address: r.store_address || '', businessHours: r.business_hours || '', currencySymbol: r.currency_symbol || '$',
    logo: r.logo || '', favicon: r.favicon || '', currency: r.currency || 'USD', facebook: '', facebookLink: ''
  }),
  toSettings: s => ({
    id: 1, store_name: s.storeName || null, store_description: s.storeDescription || null, whatsapp: s.whatsapp || null,
    email: s.email || null, instagram: s.instagram || null, instagram_link: s.instagramLink || null, tiktok: s.tiktok || null,
    tiktok_link: s.tiktokLink || null, store_address: s.address || null, business_hours: s.businessHours || null,
    currency_symbol: s.currencySymbol || '$'
  }),
  seedAdmin() {
    const admin = { username: 'admin', email: 'admin@sinister.com', password: this.hashPassword('admin123') };
    localStorage.setItem(this.KEYS.ADMIN, JSON.stringify(admin));
  },
  hashPassword(pw) {
    let hash = 0;
    for (let i = 0; i < pw.length; i++) { const char = pw.charCodeAt(i); hash = ((hash << 5) - hash) + char; hash = hash & hash; }
    return 'hash_' + Math.abs(hash).toString(16) + '_' + pw.length;
  },
  verifyPassword(input, stored) { return this.hashPassword(input) === stored; }
};
DB.ready = DB.init();
DB.seedAdmin();

const State = {
  cart: JSON.parse(localStorage.getItem(DB.KEYS.CART) || '[]'),
  isLoggedIn: !!localStorage.getItem(DB.KEYS.SESSION),
  currentRoute: window.location.hash || '#/',
  cartOpen: false,

  selectedSize: null,
  selectedColor: null,
  productQty: 1,
  saveCart() { localStorage.setItem(DB.KEYS.CART, JSON.stringify(this.cart)); },
  addToCart(product, size, color, quantity = 1) {
    const existing = this.cart.find(item => item.id === product.id && item.size === size && item.color === color);
    if (existing) { existing.quantity += quantity; }
    else { this.cart.push({ id: product.id, name: product.name, price: product.discountPrice || product.price, originalPrice: product.price, size, color, quantity, image: product.images?.[0] || '' }); }
    this.saveCart(); this.updateCartUI(); showToast('Added to cart', 'success');
  },
  removeFromCart(index) { this.cart.splice(index, 1); this.saveCart(); this.updateCartUI(); },
  updateQuantity(index, delta) {
    this.cart[index].quantity += delta;
    if (this.cart[index].quantity <= 0) { this.removeFromCart(index); return; }
    this.saveCart(); this.updateCartUI();
  },
  getCartTotal() { return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0); },
  getCartCount() { return this.cart.reduce((sum, item) => sum + item.quantity, 0); },
  clearCart() { this.cart = []; this.saveCart(); this.updateCartUI(); },
  updateCartUI() { const countEl = document.getElementById('cart-count'); if (countEl) countEl.textContent = this.getCartCount(); },
  login(username, password) {
    const admin = DB.get(DB.KEYS.ADMIN);
    if (admin && (admin.username === username || admin.email === username) && DB.verifyPassword(password, admin.password)) {
      localStorage.setItem(DB.KEYS.SESSION, JSON.stringify({ user: admin.username, time: Date.now() }));
      this.isLoggedIn = true; return true;
    }
    return false;
  },
  logout() { localStorage.removeItem(DB.KEYS.SESSION); this.isLoggedIn = false; navigate('#/'); }
};

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-brand-700', warning: 'bg-amber-600' };
  toast.className = `toast ${colors[type]} text-white px-5 py-3 rounded-lg shadow-lg font-medium text-sm`;
  toast.textContent = message; container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
}
function navigate(hash) { window.location.hash = hash; }
function formatPrice(price) { const settings = DB.get(DB.KEYS.SETTINGS) || {}; return (settings?.currencySymbol || '$') + price.toFixed(2); }
function generateId() { return crypto.randomUUID(); }

function parseRoute() {
  const hash = window.location.hash || '#/';
  const cleanHash = hash.replace('#', '');
  const parts = cleanHash.split('/').filter(Boolean);
  // Build full path (e.g., /admin/login, /product/123)
  let fullPath = '/' + (parts[0] || '');
  if (parts.length > 1) {
    // For admin sub-routes like /admin/login, /admin/products
    if (parts[0] === 'admin' && parts[1]) {
      fullPath = '/admin/' + parts[1];
    }
  }
  return { path: fullPath, params: parts.slice(1), fullParts: parts };
}

    var hash = window.location.hash || '#/';
    console.log("Hash value:", hash);
    
    // Force redirect to admin login if that's what's requested
    if (hash.indexOf('/admin/login') !== -1) {
      console.log("Detected admin login route");
      var app = document.getElementById('app');
      if (app) {
        app.innerHTML = renderAdminLogin();
        console.log("Admin login rendered");
        return;
      }
    }
    
    var route = parseRoute();
    console.log("Parsed route:", route.path, "params:", route.params);
    
    State.currentRoute = window.location.hash;
    State.cartOpen = false; 
    State.mobileMenuOpen = false;
    
    var app = document.getElementById('app');
    if (!app) { console.error("App container not found"); return; }

    // Handle admin routes explicitly
    if (hash.indexOf('/admin') !== -1) {
      console.log("Admin route detected");
      
      if (hash.indexOf('/admin/login') !== -1) {
        console.log("Rendering admin login");
        app.innerHTML = renderAdminLogin();
        return;
      }
      
      if (State.isLoggedIn) {
        console.log("User is logged in, rendering admin");
        app.innerHTML = renderAdminLayout(route.path, route.params);
        setTimeout(function() { initAdminScripts(route.path, route.params); }, 10);
      } else {
        console.log("User not logged in, redirecting to login");
        window.location.hash = '#/admin/login';
      }
      return;
    }

    // Storefront routes
    console.log("Rendering storefront:", route.path);
    app.innerHTML = renderStorefront(route.path, route.params);
    
    var settings = DB.get(DB.KEYS.SETTINGS) || {};
    var waFloat = document.getElementById('whatsapp-float');
    if (waFloat && settings.whatsapp) { waFloat.href = 'https://wa.me/' + settings.whatsapp; }
    
    setTimeout(function() { initPageScripts(route.path, route.params); }, 10);
    console.log("Storefront rendered successfully");
  } catch(e) {
    console.error('Render error:', e);
    console.error('Stack:', e.stack);
    var ed = document.getElementById('error-display');
    var em = document.getElementById('error-message');
    if (ed && em) { ed.style.display = 'flex'; em.textContent = e.message; }
  }
}

// Handle hash changes
window.addEventListener('hashchange', function() {
  console.log("Hash changed to:", window.location.hash);
  renderCurrentPage();
});

// Also handle popstate
window.addEventListener('popstate', function() {
  console.log("Popstate, hash:", window.location.hash);
  renderCurrentPage();
});

// Initial render with multiple attempts to ensure hash is ready
var initAttempts = 0;
function tryInit() {
  initAttempts++;
  console.log("Init attempt", initAttempts, "hash:", window.location.hash);
  
  if (!window.location.hash) {
    window.location.hash = '#/';
  }
  
  renderCurrentPage();
  
  // If admin/login was requested but app is empty, try again
  if (window.location.hash.indexOf('/admin/login') !== -1) {
    var app = document.getElementById('app');
    if (app && app.innerHTML.trim().length < 50 && initAttempts < 3) {
      setTimeout(tryInit, 200);
    }
  }
}

// Start initialization
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', tryInit);
} else {
  tryInit();
}
function renderStorefront(path, params) {
  const settings = DB.get(DB.KEYS.SETTINGS) || {};
  let pageContent = '';
  switch(path) {
    case '/': pageContent = renderHomePage(); break;
    case '/shop': pageContent = renderShopPage(); break;
    case '/product': pageContent = renderProductPage(params[0]); break;
    case '/categories': pageContent = renderCategoriesPage(); break;
    case '/category': pageContent = renderCategoryPage(params[0]); break;
    case '/about': pageContent = renderAboutPage(); break;
    case '/contact': pageContent = renderContactPage(); break;
    case '/cart': pageContent = renderCartPage(); break;
    case '/checkout': pageContent = renderCheckoutPage(); break;
    default: pageContent = render404();
  }
  return renderHeader(settings) + `<main class="page-content">${pageContent}</main>` + renderFooter(settings) + renderCartSidebar() + renderMobileMenu();
}

function renderCategoryPage(slug) {
  const categories = DB.get(DB.KEYS.CATEGORIES) || [];
  const category = categories.find(c => c.slug === slug);
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  if (!category) { return `<div class="py-20 text-center"><h2 class="font-serif text-3xl mb-4">Category Not Found</h2><a href="#/categories" class="text-accent-gold hover:underline">All Categories</a></div>`; }
  const categoryProducts = products.filter(p => p.category === category.name && p.enabled);
  return `
    <section class="py-12 px-4">
      <div class="max-w-7xl mx-auto">
        <nav class="text-sm text-brand-400 mb-8"><a href="#/" class="hover:text-accent-gold transition">Home</a> / <a href="#/categories" class="hover:text-accent-gold transition">Categories</a> / <span class="text-brand-200">${category.name}</span></nav>
        <div class="mb-10"><p class="text-accent-gold text-sm tracking-[0.2em] uppercase mb-2">Category</p><h1 class="font-serif text-4xl md:text-5xl font-bold mb-2">${category.name}</h1><p class="text-brand-400">${category.description} · ${categoryProducts.length} products</p></div>
        ${categoryProducts.length > 0 ? `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">${categoryProducts.map(p => renderProductCard(p)).join('')}</div>` : `<div class="text-center py-20"><p class="text-brand-400 mb-4">No products in this category yet.</p><a href="#/shop" class="btn-secondary px-6 py-3 rounded-full text-sm uppercase inline-block">Browse All Products</a></div>`}

}

function toggleCart() {
  State.cartOpen = !State.cartOpen;
  const overlay = document.getElementById('cart-overlay');
  const sidebar = document.getElementById('cart-sidebar');
  if (overlay) overlay.classList.toggle('hidden');
  if (sidebar) sidebar.classList.toggle('translate-x-full');
}

function toggleMobileMenu() {
  State.mobileMenuOpen = !State.mobileMenuOpen;
  const overlay = document.getElementById('mobile-overlay');
  const menu = document.getElementById('mobile-menu');
  if (overlay) overlay.classList.toggle('hidden');
  if (menu) menu.classList.toggle('-translate-x-full');
}

function selectSize(btn, size) {
  State.selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function selectColor(btn, color) {
  State.selectedColor = color;
  document.querySelectorAll('.color-swatch').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const nameEl = document.getElementById('selected-color-name');
  if (nameEl) nameEl.textContent = color;
}

function changeProductQty(delta) {
  State.productQty = Math.max(1, State.productQty + delta);
  const el = document.getElementById('product-qty');
  if (el) el.textContent = State.productQty;
}

function quickAddToCart(productId) {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  const product = products.find(p => p.id === productId);
  if (product) {
    State.addToCart(product, product.sizes[0], product.colors[0]?.name || 'Default', 1);
  }
}

function addToCartFromPage(productId) {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  const product = products.find(p => p.id === productId);
  if (product && State.selectedSize && State.selectedColor) {
    State.addToCart(product, State.selectedSize, State.selectedColor, State.productQty);
  }
}

function orderViaWhatsApp(productId) {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  const product = products.find(p => p.id === productId);
  const settings = DB.get(DB.KEYS.SETTINGS) || {};
  if (!product || !settings?.whatsapp) return;
  const price = product.discountPrice || product.price;
  const message = `Hello! I'm interested in ordering:\n\n📦 Product: ${product.name}\n📏 Size: ${State.selectedSize || product.sizes[0]}\n🎨 Color: ${State.selectedColor || product.colors[0]?.name}\n🔢 Quantity: ${State.productQty}\n💰 Price: ${formatPrice(price * State.productQty)}\n\nPlease confirm availability. Thank you!`;
  window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(message)}`, '_blank');
}

function sendCartViaWhatsApp() {
  const settings = DB.get(DB.KEYS.SETTINGS) || {};
  if (!settings?.whatsapp || State.cart.length === 0) return;
  let message = `Hello! I'd like to place an order:\n\n`;
  State.cart.forEach((item, i) => {
    message += `${i+1}. ${item.name}\n   Size: ${item.size} | Color: ${item.color}\n   Qty: ${item.quantity} | ${formatPrice(item.price * item.quantity)}\n\n`;
  });
  message += `💰 TOTAL: ${formatPrice(State.getCartTotal())}\n\nPlease confirm and send payment details. Thank you!`;
  window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(message)}`, '_blank');
}

function placeOrder() {
  const name = document.getElementById('customer-name')?.value.trim();
  const phone = document.getElementById('customer-phone')?.value.trim();
  const email = document.getElementById('customer-email')?.value.trim();
  const address = document.getElementById('customer-address')?.value.trim();
  const notes = document.getElementById('customer-notes')?.value.trim();
  const settings = DB.get(DB.KEYS.SETTINGS) || {};

  if (!name || !phone || !address) {
    showToast('Please fill in all required fields', 'error');
    return;
  }

  const order = {
    id: generateId(),
    customerName: name, customerPhone: phone, customerEmail: email,
    shippingAddress: address, notes: notes,
    items: [...State.cart], subtotal: State.getCartTotal(),
    status: 'new', createdAt: new Date().toISOString()
  };

  const orders = DB.get(DB.KEYS.ORDERS) || [];
  orders.unshift(order);
  DB.set(DB.KEYS.ORDERS, orders);

  // Send WhatsApp
  if (settings?.whatsapp) {
    let message = `🛍️ NEW ORDER - ${order.id.slice(0,8)}\n\n👤 Customer: ${name}\n📱 Phone: ${phone}\n${email ? `📧 Email: ${email}\n` : ''}📍 Address: ${address}\n\n📦 Items:\n`;
    State.cart.forEach((item, i) => {
      message += `${i+1}. ${item.name} (${item.size}/${item.color}) × ${item.quantity} = ${formatPrice(item.price * item.quantity)}\n`;
    });
    message += `\n💰 TOTAL: ${formatPrice(State.getCartTotal())}`;
    if (notes) message += `\n\n📝 Notes: ${notes}`;
    window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(message)}`, '_blank');
  }

  State.clearCart();
  showToast('Order placed successfully!', 'success');
  setTimeout(() => navigate('#/'), 1500);
}

function filterProducts() {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  let filtered = products.filter(p => p.enabled);
  
  const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || '';
  if (searchTerm) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm) || p.category.toLowerCase().includes(searchTerm));
  
  const selectedCats = Array.from(document.querySelectorAll('.filter-cat:checked')).map(c => c.value);
  if (selectedCats.length > 0 && !selectedCats.includes('all')) {
    filtered = filtered.filter(p => selectedCats.includes(p.category));
  }
  
  const priceFilter = document.querySelector('input[name="price-filter"]:checked')?.value || 'all';
  if (priceFilter !== 'all') {
    const [min, max] = priceFilter.split('-').map(Number);
    filtered = filtered.filter(p => { const price = p.discountPrice || p.price; return price >= min && price <= max; });
  }
  
  const inStockOnly = document.getElementById('in-stock-only')?.checked;
  if (inStockOnly) filtered = filtered.filter(p => p.stock > 0);
  
  const sortBy = document.getElementById('sort-select')?.value || 'newest';
  switch(sortBy) {
    case 'price-low': filtered.sort((a,b) => (a.discountPrice||a.price) - (b.discountPrice||b.price)); break;
    case 'price-high': filtered.sort((a,b) => (b.discountPrice||b.price) - (a.discountPrice||a.price)); break;
    case 'name': filtered.sort((a,b) => a.name.localeCompare(b.name)); break;
    default: filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  }
  
  const grid = document.getElementById('products-grid');
  const count = document.getElementById('results-count');
  if (grid) grid.innerHTML = filtered.length > 0 ? filtered.map(p => renderProductCard(p)).join('') : '<p class="col-span-full text-center text-brand-400 py-12">No products found matching your criteria.</p>';
  if (count) count.textContent = `${filtered.length} products`;
}

function openProductModal() {
  document.getElementById('modal-title').textContent = 'Add Product';
  document.getElementById('product-form').reset();
  document.getElementById('product-id').value = '';
  document.getElementById('pf-enabled').checked = true;
  document.getElementById('product-modal').classList.remove('hidden');
}

function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }

function editProduct(id) {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  const p = products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modal-title').textContent = 'Edit Product';
  document.getElementById('product-id').value = p.id;
  document.getElementById('pf-name').value = p.name;
  document.getElementById('pf-category').value = p.category;
  document.getElementById('pf-stock').value = p.stock;
  document.getElementById('pf-price').value = p.price;
  document.getElementById('pf-discount').value = p.discountPrice || '';
  document.getElementById('pf-description').value = p.description || '';
  document.getElementById('pf-sizes').value = p.sizes.join(', ');
  document.getElementById('pf-colors').value = p.colors.map(c => `${c.name}:${c.hex}`).join(', ');
  document.getElementById('pf-images').value = (p.images || []).join('\n');
  document.getElementById('pf-new').checked = p.isNew;
  document.getElementById('pf-featured').checked = p.featured;
  document.getElementById('pf-enabled').checked = p.enabled;
  document.getElementById('product-modal').classList.remove('hidden');
}

function saveProduct(e) {
  e.preventDefault();
  const id = document.getElementById('product-id').value;
  const colorsInput = document.getElementById('pf-colors').value;
  const colors = colorsInput.split(',').map(c => {
    const [name, hex] = c.trim().split(':');
    return { name: name?.trim() || 'Color', hex: hex?.trim() || '#000000' };
  }).filter(c => c.name && c.hex);
  
  const productData = {
    name: document.getElementById('pf-name').value,
    category: document.getElementById('pf-category').value,
    stock: parseInt(document.getElementById('pf-stock').value),
    price: parseFloat(document.getElementById('pf-price').value),
    discountPrice: document.getElementById('pf-discount').value ? parseFloat(document.getElementById('pf-discount').value) : null,
    description: document.getElementById('pf-description').value,
    sizes: document.getElementById('pf-sizes').value.split(',').map(s => s.trim()).filter(Boolean),
    colors: colors,
    images: document.getElementById('pf-images').value.split('\n').map(i => i.trim()).filter(Boolean),
    isNew: document.getElementById('pf-new').checked,
    featured: document.getElementById('pf-featured').checked,
    enabled: document.getElementById('pf-enabled').checked
  };

  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  if (id) {
    const idx = products.findIndex(p => p.id === parseInt(id));
    if (idx !== -1) products[idx] = { ...products[idx], ...productData };
    showToast('Product updated', 'success');
  } else {
    products.push({ id: Date.now(), ...productData, createdAt: new Date().toISOString() });
    showToast('Product added', 'success');
  }
  DB.set(DB.KEYS.PRODUCTS, products);
  closeProductModal();
  renderCurrentPage();
}

function duplicateProduct(id) {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  const p = products.find(x => x.id === id);
  if (!p) return;
  products.push({ ...JSON.parse(JSON.stringify(p)), id: Date.now(), name: p.name + ' (Copy)', createdAt: new Date().toISOString() });
  DB.set(DB.KEYS.PRODUCTS, products);
  showToast('Product duplicated', 'success');
  renderCurrentPage();
}

function toggleProduct(id) {
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  const p = products.find(x => x.id === id);
  if (!p) return;
  p.enabled = !p.enabled;
  DB.set(DB.KEYS.PRODUCTS, products);
  showToast(`Product ${p.enabled ? 'enabled' : 'disabled'}`, 'info');
  renderCurrentPage();
}

function deleteProduct(id) {
  if (!confirm('Are you sure you want to delete this product?')) return;
  const products = DB.get(DB.KEYS.PRODUCTS) || [];
  DB.set(DB.KEYS.PRODUCTS, products.filter(p => p.id !== id));
  showToast('Product deleted', 'success');
  renderCurrentPage();
}

          <button onclick="closeCategoryModal()" class="p-2 hover:bg-brand-800 rounded-lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <form id="category-form" class="p-6 space-y-4" onsubmit="saveCategory(event)">
          <input type="hidden" id="cat-id">
          <div><label class="block text-sm font-medium text-brand-300 mb-2">Name *</label><input type="text" id="cat-name" class="form-input w-full px-4 py-3 rounded-lg" required></div>
          <div><label class="block text-sm font-medium text-brand-300 mb-2">Description</label><input type="text" id="cat-desc" class="form-input w-full px-4 py-3 rounded-lg"></div>
          <div><label class="block text-sm font-medium text-brand-300 mb-2">Order</label><input type="number" id="cat-order" class="form-input w-full px-4 py-3 rounded-lg" value="1"></div>
          <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary flex-1 py-3 rounded-full text-sm uppercase font-semibold">Save</button>
            <button type="button" onclick="closeCategoryModal()" class="btn-secondary flex-1 py-3 rounded-full text-sm uppercase font-semibold">Cancel</button>
          </div>
        </form>
      </div>
    </div>`;
}

function openCategoryModal() {
  document.getElementById('cat-modal-title').textContent = 'Add Category';
  document.getElementById('category-form').reset();
  document.getElementById('cat-id').value = '';
  document.getElementById('cat-order').value = '1';
  document.getElementById('category-modal').classList.remove('hidden');
}
function closeCategoryModal() { document.getElementById('category-modal').classList.add('hidden'); }

function editCategory(id) {
  const categories = DB.get(DB.KEYS.CATEGORIES) || [];
  const cat = categories.find(c => c.id === id);
  if (!cat) return;
  document.getElementById('cat-modal-title').textContent = 'Edit Category';
  document.getElementById('cat-id').value = cat.id;
  document.getElementById('cat-name').value = cat.name;
  document.getElementById('cat-desc').value = cat.description;
  document.getElementById('cat-order').value = cat.order;
  document.getElementById('category-modal').classList.remove('hidden');
}

function saveCategory(e) {
  e.preventDefault();
  const id = document.getElementById('cat-id').value;
  const name = document.getElementById('cat-name').value;
  const slug = name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  const catData = { name, slug, description: document.getElementById('cat-desc').value, order: parseInt(document.getElementById('cat-order').value) || 1, image: '' };
  const categories = DB.get(DB.KEYS.CATEGORIES) || [];
  if (id) {
    const idx = categories.findIndex(c => c.id === parseInt(id));
    if (idx !== -1) categories[idx] = { ...categories[idx], ...catData };
    showToast('Category updated', 'success');
  } else {
    categories.push({ id: Date.now(), ...catData });
    showToast('Category added', 'success');
  }
  DB.set(DB.KEYS.CATEGORIES, categories);
  closeCategoryModal();
  renderCurrentPage();
}

function deleteCategory(id) {
  if (!confirm('Delete this category? Products will not be deleted.')) return;
  const categories = DB.get(DB.KEYS.CATEGORIES) || [];
  DB.set(DB.KEYS.CATEGORIES, categories.filter(c => c.id !== id));
  showToast('Category deleted', 'success');
  renderCurrentPage();
}

                    ${statuses.map(s => `<option value="${s}" ${order.status===s?'selected':''} class="bg-brand-900">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}

              </tr>`).join('')}

      <div id="order-modal-content" class="relative bg-brand-900 rounded-2xl border border-brand-800 w-full max-w-lg max-h-[90vh] overflow-y-auto"></div>
    </div>`;
}

function updateOrderStatus(orderId, status) {
  const orders = DB.get(DB.KEYS.ORDERS) || [];
  const order = orders.find(o => o.id === orderId);
  if (order) { order.status = status; DB.set(DB.KEYS.ORDERS, orders); showToast('Status updated', 'success'); }
}

function viewOrderDetails(orderId) {
  const orders = DB.get(DB.KEYS.ORDERS) || [];
  const order = orders.find(o => o.id === orderId);
  if (!order) return;
  const content = document.getElementById('order-modal-content');
  content.innerHTML = `
    <div class="border-b border-brand-800 px-6 py-4 flex items-center justify-between">
      <h2 class="font-serif text-xl font-bold">Order #${order.id.slice(0, 8)}</h2>
      <button onclick="closeOrderModal()" class="p-2 hover:bg-brand-800 rounded-lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="p-6 space-y-6">
      <div><h3 class="text-sm uppercase tracking-wide text-brand-500 mb-2">Customer</h3><p class="font-medium">${order.customerName}</p><p class="text-brand-400 text-sm">${order.customerPhone}</p>${order.customerEmail?`<p class="text-brand-400 text-sm">${order.customerEmail}</p>`:''}</div>
      <div><h3 class="text-sm uppercase tracking-wide text-brand-500 mb-2">Shipping Address</h3><p class="text-brand-300">${order.shippingAddress}</p></div>
      <div><h3 class="text-sm uppercase tracking-wide text-brand-500 mb-2">Items</h3><div class="space-y-2">${order.items.map(item => `<div class="flex justify-between text-sm py-2 border-b border-brand-800"><span>${item.name} (${item.size}/${item.color}) × ${item.quantity}</span><span class="text-accent-gold">${formatPrice(item.price * item.quantity)}</span></div>`).join('')}</div></div>
      ${order.notes?`<div><h3 class="text-sm uppercase tracking-wide text-brand-500 mb-2">Notes</h3><p class="text-brand-300">${order.notes}</p></div>`:''}
      <div class="pt-4 border-t border-brand-800 flex justify-between text-lg font-bold"><span>Total</span><span class="text-accent-gold">${formatPrice(order.subtotal)}</span></div>
    </div>`;
  document.getElementById('order-modal').classList.remove('hidden');
}
function closeOrderModal() { document.getElementById('order-modal').classList.add('hidden'); }

function saveSettings(e) {
  e.preventDefault();
  const settings = {

    logo: document.getElementById('set-logo').value,
    address: document.getElementById('set-address').value,
    businessHours: document.getElementById('set-businessHours').value,
    whatsapp: document.getElementById('set-whatsapp').value,
    email: document.getElementById('set-email').value,
    instagram: document.getElementById('set-instagram').value,
    instagramLink: document.getElementById('set-instagramLink').value,
    tiktok: document.getElementById('set-tiktok').value,
    tiktokLink: document.getElementById('set-tiktokLink').value,
    currency: 'USD', favicon: '', facebook: '', facebookLink: ''
  };
  DB.set(DB.KEYS.SETTINGS, settings);
  showToast('Settings saved successfully', 'success');
}

// Initialize - ensure hash is present
if (!window.location.hash) {
  window.location.hash = '#/';
}
// Small delay to ensure hash is processed
setTimeout(function() {
  DB.ready.then(function() {
    try {
      renderCurrentPage();
    } catch(e) {
    console.error("Initial render failed:", e);
    var ed = document.getElementById('error-display');
    var em = document.getElementById('error-message');
      if (ed && em) { ed.style.display = 'flex'; em.textContent = e.message; }
    }
  });
}, 50);

// Also handle direct hash access on load
window.addEventListener('load', function() {
  if (window.location.hash && window.location.hash !== '#/') {
    setTimeout(function() { renderCurrentPage(); }, 100);
  }
});
</script>
